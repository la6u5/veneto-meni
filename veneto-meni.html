function makePanel(key){const panel=document.createElement('div');panel.className='accordion-panel';panel.hidden=true;const rows=document.createElement('div');rows.className='rows';menu[key].forEach(entry=>{if(entry.h){const h=document.createElement('h3');h.className='group-title';h.textContent=entry.h;rows.append(h);return}const row=document.createElement('div');row.className='item';const info=document.createElement('div');info.className='item-name';info.textContent=entry.n;if(entry.d){const d=document.createElement('span');d.className='item-desc';d.textContent=entry.d;info.append(d)}row.append(info);const p=document.createElement('div');p.className=entry.p?'price':'price todo';p.textContent=entry.p?entry.p+' RSD':'Cena se dopunjava';row.append(p);rows.append(row)});panel.append(rows);return panel}
order.forEach(key=>{const box=document.createElement('section');box.className='accordion';const button=document.createElement('button');button.className='accordion-button';button.type='button';button.setAttribute('aria-expanded','false');const label=document.createElement('span');label.textContent=key;const chevron=document.createElement('span');chevron.className='chevron';chevron.setAttribute('aria-hidden','true');chevron.textContent='⌄';button.append(label,chevron);const panel=makePanel(key);button.setAttribute('aria-controls','panel-'+order.indexOf(key));panel.id='panel-'+order.indexOf(key);button.onclick=()=>{const opening=panel.hidden;document.querySelectorAll('.accordion-panel').forEach(p=>p.hidden=true);document.querySelectorAll('.accordion-button').forEach(b=>b.setAttribute('aria-expanded','false'));if(opening){panel.hidden=false;button.setAttribute('aria-expanded','true')}};box.append(button,panel);cats.append(box)});</script></body></html>
